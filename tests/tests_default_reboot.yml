---
- name: Ensure that the rule runs with default parameters
  hosts: all
  vars:
    kdump_reboot_ok: true
    kdump_dracut_args: --kernel-cmdline nopti
    kdump_auto_reset_crashkernel: true
  tags:
    - tests::reboot
  tasks:
    - name: See if /dev/log exists for the fingerprint check
      ansible.builtin.stat:
        path: /dev/log
      register: __register_dev_log

    - name: Set the start time for the journal search
      ansible.builtin.set_fact:
        __journal_start_time: "{{ ansible_facts['date_time']['date'] ~ ' ' ~ ansible_facts['date_time']['time'] }}"
      when: __register_dev_log.stat.exists

    - name: Run the role and reboot if necessary
      include_tasks: tasks/run_role_with_clear_facts.yml
      vars:
        __sr_public: true
        __kdump_write_log_file: true

    - name: Get fingerprint entries from journal
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: >-
          set -eo pipefail;
          journalctl --since "{{ __journal_start_time }}" --no-pager |
          grep -v " Invoked with" |
          grep "sr_fingerprint.*role_name=kdump"
      register: __register_journal_fingerprints
      changed_when: false
      when: __register_dev_log.stat.exists

    - name: Check that the log file was written
      ansible.builtin.slurp:
        path: /var/log/sysroles.jsonl
      register: __register_log_file

    - name: Verify log file and journal fingerprints
      when: __register_dev_log.stat.exists
      vars:
        __journal_lines: "{{ __register_journal_fingerprints.stdout_lines }}"
        __journal_begin: "{{ __journal_lines | select('search', 'status=begin') | list }}"
        __journal_success: "{{ __journal_lines | select('search', 'status=success') | list }}"
        __begin_date: "{{ (__journal_begin[0] | regex_search('date=([^ ]+)', '\\1'))[0] }}"
        __success_date: "{{ (__journal_success[0] | regex_search('date=([^ ]+)', '\\1'))[0] }}"
        __file_content: "{{ __register_log_file.content | b64decode }}"
      block:
        - name: Print contents of logs
          debug:
            var: item
          loop:
            - "{{ __file_content }}"
            - "{{ __journal_lines }}"

        - name: Assert content is correct
          ansible.builtin.assert:
            that:
              - __journal_begin | length > 0
              - __journal_success | length > 0
              - __begin_date in __file_content
              - __success_date in __file_content

    - name: Notify and run handlers
      meta: flush_handlers

    - name: Check generated files for ansible_managed, fingerprint
      include_tasks: tasks/check_header.yml
      vars:
        __fingerprint: "system_role:kdump"
        __file: "{{ __kdump_conf_file }}"

    - name: See if el9 or later, el7 or el8, or Suse
      set_fact:
        is_el9: "{{
          ansible_facts['distribution'] in ['RedHat', 'CentOS', 'Fedora']
          and ansible_facts['distribution_major_version'] | int >= 9 }}"
        is_el7_or_el8: "{{
          ansible_facts['distribution'] in ['RedHat', 'CentOS']
          and ansible_facts['distribution_major_version'] | int in [7, 8] }}"
        is_suse: "{{ ansible_facts['os_family'] == 'Suse' }}"

    - name: Check for crashkernel, grubby settings
      when: is_el9 or is_el7_or_el8
      block:
        - name: Check parameters in conf file
          command: grep '^{{ item.param }} {{ item.value }}$' /etc/kdump.conf
          changed_when: false
          # not really invalid - see https://github.com/ansible/ansible-lint/issues/4702
          # noqa jinja[invalid]
          loop: "{{ params + (is_el9 | ternary(el9_params, not_el9_params)) }}"
          vars:
            params:
              - param: dracut_args
                value: "{{ kdump_dracut_args }}"
            el9_params:
              - param: auto_reset_crashkernel
                value: "{{ kdump_auto_reset_crashkernel |
                  ternary('yes', 'no') }}"
              - param: failure_action
                value: "{{ kdump_system_action }}"
            not_el9_params:
              - param: default
                value: "{{ kdump_system_action }}"

        - name: Get crashkernel setting EL 9 and later
          command: kdumpctl get-default-crashkernel
          changed_when: false
          register: __crashkernel
          when: is_el9 | bool

        - name: Get crashkernel setting EL 8 and earlier
          set_fact:
            __crashkernel:
              stdout: auto
          when: is_el7_or_el8 | bool

        - name: Check for crashkernel setting
          shell: >
            set -euo pipefail;
            grubby --info=ALL | grep -E {{ pattern | quote }}
          changed_when: false
          vars:
            pattern: ^args=.* crashkernel={{ __crashkernel.stdout }}( |"|$)

    - name: Check the generated sysconfig and the reserved crashkernel (Suse)
      when: is_suse | bool
      block:
        # Source the file, the way kdump reads it
        - name: Read the settings kdump will actually see
          shell:
            executable: /bin/bash
            cmd: |
              set -euo pipefail
              . /etc/sysconfig/kdump
              echo "$KDUMP_SAVEDIR"
          register: __suse_savedir
          changed_when: false
          check_mode: false

        - name: Read the crash kernel reservation the running kernel made
          slurp:
            path: /sys/kernel/kexec_crash_size
          register: __suse_crash_size

        - name: Assert the dump target is set and crash kernel memory is reserved
          assert:
            that:
              - __suse_savedir.stdout == 'file://' ~ kdump_path
              - __suse_crash_size.content | b64decode | int > 0

    - name: Change parameters and run the role again
      set_fact:
        kdump_auto_reset_crashkernel: false
        kdump_dracut_args: --print-cmdline
        # Only read on SUSE
        kdump_sysconfig:
          KDUMP_DUMPLEVEL: 16

    - name: Ask for a debug shell when dumping fails (Suse)
      set_fact:
        kdump_system_action: shell
      when: is_suse | bool

    - name: Run the role again with new parameters
      include_tasks: tasks/run_role_with_clear_facts.yml

    - name: Notify and run handlers again
      meta: flush_handlers

    - name: Check for crashkernel, grubby settings again
      when: is_el9 or is_el7_or_el8
      block:
        - name: Check parameters in conf file
          command: grep '^{{ item.param }} {{ item.value }}$' /etc/kdump.conf
          changed_when: false
          # not really invalid - see https://github.com/ansible/ansible-lint/issues/4702
          # noqa jinja[invalid]
          loop: "{{ params + (is_el9 | ternary(el9_params, [])) }}"
          vars:
            el9_params:
              - param: auto_reset_crashkernel
                value: "{{ kdump_auto_reset_crashkernel |
                  ternary('yes', 'no') }}"
            params:
              - param: dracut_args
                value: "{{ kdump_dracut_args }}"

        - name: Get crashkernel setting EL 9 and later
          command: kdumpctl get-default-crashkernel
          changed_when: false
          register: __crashkernel
          when: is_el9 | bool

        - name: Get crashkernel setting EL 8 and earlier
          set_fact:
            __crashkernel:
              stdout: auto
          when: is_el7_or_el8 | bool

        - name: Check for crashkernel setting
          shell: >
            set -euo pipefail;
            grubby --info=ALL | grep -E {{ pattern | quote }}
          changed_when: false
          vars:
            pattern: ^args=.* crashkernel={{ __crashkernel.stdout }}( |"|$)

    - name: Check kdump_sysconfig and kdump_system_action reached the sysconfig (Suse)
      when: is_suse | bool
      block:
        - name: Read the settings kdump will see after the second run
          shell:
            executable: /bin/bash
            cmd: |
              set -euo pipefail
              . /etc/sysconfig/kdump
              printf '%s\n' "$KDUMP_DUMPLEVEL" "$KDUMP_CONTINUE_ON_ERROR"
          register: __suse_settings
          changed_when: false
          check_mode: false

        - name: Assert the passthrough value and the failure action
          assert:
            that:
              - __suse_settings.stdout_lines == ['16', 'false']

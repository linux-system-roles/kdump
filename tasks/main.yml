---
- name: Ensure ansible_facts used by role
  include_tasks: set_vars.yml

- name: Validate role parameters
  ansible.builtin.include_tasks: assert_role_vars.yml

- name: Install required packages
  package:
    name: "{{ __kdump_packages }}"
    state: present
    use: "{{ (__kdump_is_ostree | d(false)) |
             ternary('ansible.posix.rhel_rpm_ostree', omit) }}"
  register: __kdump_package_result

# A staged install reports ok on re-runs, so ask rpm (by provides) if it is live.
- name: Check whether the packages are live on a transactional update system
  command:  # noqa command-instead-of-module
    argv: "{{ ['rpm', '-q', '--whatprovides'] + __kdump_packages }}"
  register: __kdump_packages_live
  changed_when: false
  failed_when: false
  check_mode: false
  when: __kdump_is_transactional

- name: Handle reboot for transactional update systems
  when:
    - __kdump_is_transactional
    - __kdump_package_result is changed or
      (__kdump_packages_live.rc | d(0)) != 0
  block:
    - name: Notify user that reboot is needed to apply changes
      debug:
        msg: >
          Reboot required to apply changes due to transactional updates.

    - name: Reboot transactional update systems
      reboot:
        msg: Rebooting the system to apply transactional update changes.
      when:
        - kdump_transactional_update_reboot_ok is not none
        - kdump_transactional_update_reboot_ok | bool

    - name: Fail if reboot is needed and not set
      fail:
        msg: >
          Reboot is required but not allowed. Please set 'kdump_transactional_update_reboot_ok' to proceed.
      when:
        - kdump_transactional_update_reboot_ok is none

- name: Ensure that kdump is enabled
  service:
    name: "{{ __kdump_service }}"
    enabled: true

- name: Include SSH tasks
  include_tasks: ssh.yml
  when:
    - kdump_target.type | d(none) == 'ssh'

- name: Get mode of kdump configuration file if it exists
  stat:
    path: "{{ __kdump_conf_file }}"
  register: __kdump_conf

- name: Generate kdump configuration file
  template:
    src: "{{ __kdump_conf_template }}"
    dest: "{{ __kdump_conf_file }}"
    backup: true
    mode: "{{ __kdump_conf.stat.mode | d('0644') }}"
  notify: Restart kdump

- name: Find out reserved memory for the crash kernel
  slurp:
    src: /sys/kernel/kexec_crash_size
  register: kexec_crash_size
  until: kexec_crash_size is success

- name: Set the kdump_reboot_required fact
  set_fact:
    kdump_reboot_required: "{{
      kexec_crash_size.content | b64decode | int < 1 }}"

- name: Update crashkernel setting if needed
  when:
    - kdump_reboot_required | bool
    - ansible_facts['distribution'] in ['RedHat', 'CentOS', 'Fedora']
  block:
    - name: Use kdumpctl reset-crashkernel if needed
      command: kdumpctl reset-crashkernel --kernel=ALL
      when: ansible_facts['distribution_major_version'] | int >= 9
      changed_when: true

    - name: Use grubby to update crashkernel=auto if needed
      command: grubby --args=crashkernel=auto --update-kernel=ALL
      when: ansible_facts['distribution_major_version'] | int <= 8
      changed_when: true

- name: Fail if a transactional update system has no crash kernel memory
  fail:
    msg: >-
      No memory is reserved for the crash kernel, and the boot loader of a
      transactional update system cannot be changed in place. Run
      'transactional-update setup-kdump', reboot, and re-execute the role.
  when:
    - __kdump_is_transactional
    - kdump_reboot_required | bool

# Same invocation as kdump-commandline.service
- name: Use kdumptool commandline to update crashkernel if needed
  command: /usr/sbin/kdumptool commandline -c -U
  when:
    - kdump_reboot_required | bool
    - ansible_facts['os_family'] == 'Suse'
  changed_when: true

- name: Fail if reboot is required and kdump_reboot_ok is false
  fail:
    msg: >-
      "Reboot is required to apply changes. Re-execute the role after boot to
      ensure that kdump is working."
  when:
    - kdump_reboot_required | bool
    - not kdump_reboot_ok

- name: Reboot the managed node
  reboot:
  when:
    - kdump_reboot_required | bool
    - kdump_reboot_ok | bool

- name: Clear the kdump_reboot_required flag
  set_fact:
    kdump_reboot_required: false
  when:
    - kdump_reboot_required | bool
    - kdump_reboot_ok | bool

# This task is for users who run the role after reboot. The handlers do not run
# in this case, because the role results in not changed state. It is necessary
# to explicitly start kdump to rebuild initrd.
- name: Ensure that kdump is started
  service:
    name: "{{ __kdump_service }}"
    state: started
  register: __kdump_service_start

- name: Record role success fingerprint
  sr_fingerprint:
    status: success
    role_name: kdump
    role_path: "{{ role_path }}"
    ansible_play_hosts_all: "{{ ansible_play_hosts_all }}"
    distribution: "{{ ansible_facts['distribution'] }}"
    distribution_version: "{{ ansible_facts['distribution_version'] }}"
    write_log_file: "{{ __kdump_write_log_file }}"

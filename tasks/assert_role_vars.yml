# SPDX-License-Identifier: MIT
---
- name: Assert kdump_target is null or a dictionary
  ansible.builtin.assert:
    that:
      - >-
        (kdump_target is none)
        or (kdump_target is mapping)
    fail_msg: >-
      kdump_target must be null or a dictionary,
      got {{ kdump_target | type_debug }}
  when: kdump_target is defined

- name: Assert kdump_target dict contains only valid keys
  ansible.builtin.assert:
    that:
      - >-
        kdump_target.keys() | list | difference(__kdump_target_valid_keys)
        | length == 0
    fail_msg: >-
      kdump_target contains invalid keys:
      {{ kdump_target.keys() | list | difference(__kdump_target_valid_keys) | join(', ') }}
  vars:
    __kdump_target_valid_keys:
      - type
      - location
  when: kdump_target is mapping

- name: Assert kdump_target.type is set and is a string
  ansible.builtin.assert:
    that:
      - kdump_target.type is defined
      - kdump_target.type is string
    fail_msg: >-
      kdump_target.type must be a string,
      got {{ kdump_target.type | default('undefined') | type_debug }}
  when: kdump_target is mapping

- name: Assert kdump_target.location is a string when set
  ansible.builtin.assert:
    that:
      - kdump_target.location is string
    fail_msg: >-
      kdump_target.location must be a string,
      got {{ kdump_target.location | type_debug }}
  when:
    - kdump_target is mapping
    - kdump_target.location is defined

# The checks below run only where vars/ declares the platform's limits
- name: Assert this platform is new enough for the role to configure kdump
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution_major_version'] | int
        >= __kdump_minimum_distribution_major_version | int
    fail_msg: >-
      This role cannot configure kdump on {{ ansible_facts['distribution'] }}
      {{ ansible_facts['distribution_major_version'] }}. It needs
      {{ ansible_facts['distribution'] }}
      {{ __kdump_minimum_distribution_major_version }} or later, because the
      crash kernel reservation has no mechanism before that.
  when: __kdump_minimum_distribution_major_version is defined

- name: Assert kdump_sysconfig does not set what the role already derives
  ansible.builtin.assert:
    that:
      - kdump_sysconfig.keys() | list | intersect(__kdump_sysconfig_reserved_keys) | length == 0
    fail_msg: >-
      kdump_sysconfig may not set
      {{ kdump_sysconfig.keys() | list | intersect(__kdump_sysconfig_reserved_keys) | join(', ') }},
      which the role derives from its own variables. Use those instead.
  when:
    - __kdump_sysconfig_reserved_keys is defined
    - kdump_sysconfig is defined
    - kdump_sysconfig is mapping
